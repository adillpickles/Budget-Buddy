name: Terraform Infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_VAR_vercel_team_id: ${{ vars.VERCEL_TEAM_ID }}
  VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}

jobs:
  static-checks:
    name: Terraform static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init without remote backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  plan-and-apply:
    name: Terraform plan/apply
    if: github.event_name != 'pull_request'
    needs: static-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Check Terraform automation inputs
        shell: bash
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          test -n "$TF_CLOUD_ORGANIZATION" || { echo "Missing repository variable TF_CLOUD_ORGANIZATION"; exit 1; }
          test -n "$TF_API_TOKEN" || { echo "Missing repository secret TF_API_TOKEN"; exit 1; }
          test -n "$VERCEL_API_TOKEN" || { echo "Missing repository secret VERCEL_API_TOKEN"; exit 1; }

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
